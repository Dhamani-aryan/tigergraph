# Builds the static investigation console in ui/ and publishes it to GitHub Pages.
# Manual trigger only, so nothing deploys until a maintainer chooses the data mode.
name: ui-pages

on:
  workflow_dispatch:
    inputs:
      data:
        description: "Data to publish: 'official' runs strict sync against cases/ and runs/latest/ (fails if incomplete); 'committed' uses ui/public/data as committed"
        type: choice
        options: [committed, official]
        default: committed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ui-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - name: Strict official sync
        if: ${{ inputs.data == 'official' }}
        run: npm run sync-data -- --strict
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
